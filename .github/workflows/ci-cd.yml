name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Train model & run Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Train model
        run: python -m src.train

      - name: Run tests with coverage
        run: pytest --cov=app --cov=src --cov-report=term-missing

  docker:
    name: Build & smoke-test Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t placement-api:${{ github.sha }} .

      - name: Run container
        run: docker run -d --name api -p 8000:8000 placement-api:${{ github.sha }}

      - name: Smoke test /health and /predict
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"cgpa":8.5,"iq":115,"internships":2,"projects":4,"certifications":3,"communication_skills":8,"backlogs":0,"extracurricular":1}'

      - name: Show container logs on failure
        if: failure()
        run: docker logs api

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set" && exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
